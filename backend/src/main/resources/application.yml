logging:
  structured:
    format:
      console: logstash
  level:
    # Identity challenges/passwords are never safe JDBC/Hibernate bind diagnostics.
    org.springframework.jdbc.core.StatementCreatorUtils: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

spring:
  servlet:
    multipart:
      enabled: false
  main:
    banner-mode: "off"
  application:
    name: commonbeacon
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true
  tomcat:
    connection-timeout: 30s
    max-http-form-post-size: 16KB
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

commonbeacon:
  email:
    outbox:
      enabled: ${EMAIL_OUTBOX_ENABLED:false}
      active-key: ${EMAIL_OUTBOX_ACTIVE_KEY:}
      # External secret: comma-separated key-id=base64-32-byte-key entries. No default key.
      keys: ${EMAIL_OUTBOX_KEYS:}
  identity:
    # Keep legacy ACTIVE access until the verified-account rollout is qualified.
    # ENFORCED requires current-address proof for community and company authority.
    verification-mode: ${EMAIL_VERIFICATION_MODE:TRANSITION}
  erasure:
    company-enabled: ${COMPANY_ERASURE_ENABLED:false}
    backup-retention-days: ${ERASURE_BACKUP_RETENTION_DAYS:30}
  transfer:
    storage:
      enabled: ${TRANSFER_STORAGE_ENABLED:false}
      directory: ${TRANSFER_STORAGE_DIRECTORY:}
  demo:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:}
