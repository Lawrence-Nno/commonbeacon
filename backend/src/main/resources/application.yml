logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

spring:
  servlet:
    multipart:
      enabled: false
  main:
    banner-mode: "off"
  application:
    name: commonbeacon
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true
  tomcat:
    connection-timeout: 30s
    max-http-form-post-size: 16KB
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

commonbeacon:
  transfer:
    storage:
      enabled: ${TRANSFER_STORAGE_ENABLED:false}
      directory: ${TRANSFER_STORAGE_DIRECTORY:}
  demo:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:}
