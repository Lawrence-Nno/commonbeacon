server {
    # Raw combined access logs include malformed query-token links. Backend request
    # logging supplies sanitized API diagnostics; never record frontend URL secrets.
    access_log off;
    # Proxy/file errors can also include the original request URL and query.
    error_log /dev/null;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/health {
        proxy_pass $backend/actuator/health;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ~ "^/api/v1/admin/data/imports/[0-9a-fA-F-]{36}/archive$" {
        client_max_body_size 64m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 630s;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        # SPA fallback internally redirects token routes to index.html; protect
        # that final response too so it cannot silently lose security headers.
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
