name: commonbeacon
services:
  db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commonbeacon}
      POSTGRES_USER: ${POSTGRES_USER:-commonbeacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-commonbeacon}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-commonbeacon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COMPANY_ERASURE_ENABLED: ${COMPANY_ERASURE_ENABLED:-false}
      ERASURE_BACKUP_RETENTION_DAYS: ${ERASURE_BACKUP_RETENTION_DAYS:-30}
      EMAIL_VERIFICATION_MODE: ${EMAIL_VERIFICATION_MODE:-TRANSITION}
      EMAIL_OUTBOX_ENABLED: ${EMAIL_OUTBOX_ENABLED:-false}
      EMAIL_OUTBOX_ACTIVE_KEY: ${EMAIL_OUTBOX_ACTIVE_KEY:-}
      EMAIL_OUTBOX_KEYS: ${EMAIL_OUTBOX_KEYS:-}
      EMAIL_SMTP_ENABLED: ${EMAIL_SMTP_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS:-STARTTLS}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_SUPPORT: ${EMAIL_SUPPORT:-}
      EMAIL_PUBLIC_ORIGIN: ${EMAIL_PUBLIC_ORIGIN:-}
      EMAIL_SMTP_CONNECT_TIMEOUT_MS: ${EMAIL_SMTP_CONNECT_TIMEOUT_MS:-10000}
      EMAIL_SMTP_READ_TIMEOUT_MS: ${EMAIL_SMTP_READ_TIMEOUT_MS:-10000}
      EMAIL_SMTP_WRITE_TIMEOUT_MS: ${EMAIL_SMTP_WRITE_TIMEOUT_MS:-10000}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-false}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-20}
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-2}
      EMAIL_WORKER_ATTEMPTS_PER_HOUR: ${EMAIL_WORKER_ATTEMPTS_PER_HOUR:-600}
      EMAIL_WORKER_INTERVAL_MS: ${EMAIL_WORKER_INTERVAL_MS:-1000}
      EMAIL_WORKER_TIMEOUT_MS: ${EMAIL_WORKER_TIMEOUT_MS:-15000}
      EMAIL_WORKER_SHUTDOWN_MS: ${EMAIL_WORKER_SHUTDOWN_MS:-20000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
