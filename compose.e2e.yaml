# Standalone browser-test stack. No development .env, volume, or service references.
services:
  db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: commonbeacon_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: disposable-e2e-database-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "e2e", "-d", "commonbeacon_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/commonbeacon_e2e
      SPRING_DATASOURCE_USERNAME: e2e
      SPRING_DATASOURCE_PASSWORD: disposable-e2e-database-only
      DEMO_SEED_ENABLED: "true"
      DEMO_PASSWORD: disposable-e2e-demo-password
    ports:
      - "127.0.0.1:4180:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
